<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Advanced Algorithmic Terminal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <script type="text/javascript" src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <span class="logo">BINANCE FUTURES</span>
            <span class="symbol-display">BTCUSDT</span>
            <span id="live-price" class="nav-price">0.00</span>
        </div>
        <div class="nav-right">
            <div class="algo-toggle">
                <span>RSI Auto-Trading</span>
                <label class="switch">
                    <input type="checkbox" id="algo-switch">
                    <span class="slider round"></span>
                </label>
            </div>
            <div class="wallet-balance">
                <span class="label">Margin:</span>
                <span id="available-margin" class="value text-cyan">0.00 USDT</span>
            </div>
        </div>
    </nav>
    <main class="exchange-grid">
        <section class="chart-container" id="chart-container"></section>
        <section class="order-panel">
            <div class="panel-header">Place Order</div>
            <form id="trade-form">
                <div class="order-tabs">
                    <button type="button" class="tab active" data-type="MARKET">Market</button>
                    <button type="button" class="tab" data-type="LIMIT">Limit</button>
                    <input type="hidden" id="order-type" value="MARKET">
                </div>
                <div class="input-group" id="price-group" style="display: none;">
                    <label>Price</label>
                    <div class="input-wrapper">
                        <input type="number" id="price" step="0.1">
                        <span class="currency">USDT</span>
                    </div>
                </div>
                <div class="input-group">
                    <label>Size</label>
                    <div class="input-wrapper">
                        <input type="number" id="quantity" step="0.001" min="0.001" value="0.01" required>
                        <span class="currency">BTC</span>
                    </div>
                </div>
                <div class="advanced-section">
                    <label class="checkbox-label">
                        <input type="checkbox" id="use-tpsl">
                        Take Profit / Stop Loss
                    </label>
                    <div class="tpsl-inputs" id="tpsl-inputs" style="display: none;">
                        <div class="input-group">
                            <label>TP Price</label>
                            <input type="number" id="tp-price" step="0.1">
                        </div>
                        <div class="input-group">
                            <label>SL Price</label>
                            <input type="number" id="sl-price" step="0.1">
                        </div>
                    </div>
                </div>
                <div class="action-buttons">
                    <button type="button" id="buy-btn" class="btn btn-buy">Buy / Long</button>
                    <button type="button" id="sell-btn" class="btn btn-sell">Sell / Short</button>
                    <input type="hidden" id="side" value="BUY">
                </div>
            </form>
            <div class="console-output" id="status-message">Terminal Ready...</div>
        </section>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
