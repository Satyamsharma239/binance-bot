<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groww-Killer | Smart Auto-Invest</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
    <script type="text/javascript" src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Feather Icons for clean UI elements -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body>
    
    <!-- Top Navigation Bar (Clean & Simple) -->
    <nav class="navbar">
        <div class="nav-left">
            <div class="logo">
                <i data-feather="trending-up" class="logo-icon"></i>
                <span>TradePro</span>
            </div>
            <div class="nav-links">
                <a href="#" class="active">Explore</a>
                <a href="#">Portfolio</a>
            </div>
        </div>
        <div class="nav-right">
            <div class="balance-badge">
                <i data-feather="wallet" class="icon-sm"></i>
                <span id="available-margin">₹0.00</span>
            </div>
            <div class="profile-avatar">S</div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="app-container">
        
        <!-- Left Side: Asset Chart -->
        <section class="asset-section">
            <div class="asset-header">
                <img src="https://cryptologos.cc/logos/bitcoin-btc-logo.png" alt="BTC" class="asset-icon">
                <div>
                    <h1 class="asset-title">Bitcoin (BTC/USDT)</h1>
                    <div class="asset-price-row">
                        <span class="live-price" id="live-price">$0.00</span>
                        <span class="price-change positive" id="price-change">+0.00%</span>
                    </div>
                </div>
            </div>
            
            <div class="chart-card">
                <div id="chart-container" style="width: 100%; height: 100%;"></div>
            </div>
            
            <!-- Portfolio Tracker (Bottom Left) -->
            <div class="portfolio-section">
                <h2 class="section-title">Your Investment</h2>
                <div class="portfolio-card" id="pos-data">
                    <div class="empty-state">
                        <i data-feather="briefcase" class="empty-icon"></i>
                        <p>No active investments right now.</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Right Side: Smart Action Panel -->
        <section class="action-section">
            
            <!-- The Killer Feature: Autopilot -->
            <div class="action-card autopilot-card">
                <div class="autopilot-header">
                    <div class="header-text">
                        <h3>AI Autopilot</h3>
                        <p>Let our smart algorithms trade for you 24/7.</p>
                    </div>
                    <label class="toggle-switch">
                        <input type="checkbox" id="algo-switch">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
                <div class="autopilot-status" id="core-status">
                    <i data-feather="moon" class="status-icon"></i>
                    <span>Autopilot is currently paused.</span>
                </div>
            </div>

            <!-- Manual Trading (Groww-Style) -->
            <div class="action-card manual-trade-card">
                <div class="trade-tabs">
                    <button class="tab-btn active" data-side="BUY">Buy</button>
                    <button class="tab-btn" data-side="SELL">Sell</button>
                </div>
                
                <form id="trade-form">
                    <div class="input-box">
                        <label>Amount (BTC)</label>
                        <div class="input-row">
                            <input type="number" id="quantity" step="0.001" min="0.001" value="0.01">
                        </div>
                    </div>
                    
                    <div class="order-summary">
                        <span>Order Type</span>
                        <span class="summary-val">Market</span>
                    </div>
                    
                    <button type="button" class="btn-primary" id="execute-btn">Buy Bitcoin</button>
                </form>
            </div>
            
            <!-- Kill Switch (Safety) -->
            <div class="safety-card">
                <div class="safety-info">
                    <i data-feather="shield" class="shield-icon"></i>
                    <span>Flash-Crash Protection Active</span>
                </div>
                <button id="kill-switch" class="btn-danger">Close All Positions</button>
            </div>
            
            <!-- Hidden inputs for JS logic -->
            <input type="hidden" id="order-type" value="MARKET">
            <input type="hidden" id="side" value="BUY">

        </section>
    </main>

    <script>
        feather.replace();
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
